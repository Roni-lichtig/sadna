<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoNet – עובדים טוב יותר, ביחד</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Global navbar + system design -->
    <link rel="stylesheet" href="auth.css">

    <!-- Landing specific -->
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<!-- =========================
     TOP NAVBAR (GUEST)
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="communities.html">הקהילות של CoNet</a>
            <a href="search.html">המרחבים של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <div class="conet-user">
            <button onclick="window.location.href='signup.html'">
                הצטרפות
            </button>
        </div>

    </div>
</header>

<!-- =========================
     HERO
========================= -->
<main class="hero">

    <!-- WAVES BACKGROUND -->
    <div class="wave-bg">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
            <path d="M0 260 C 300 240, 600 300, 900 260, 1200 230, 1440 260" class="wave wave1"/>
            <path d="M0 290 C 300 270, 600 330, 900 290, 1200 260, 1440 290" class="wave wave2"/>
            <path d="M0 320 C 300 300, 600 360, 900 320, 1200 290, 1440 320" class="wave wave3"/>
            <path d="M0 350 C 300 330, 600 390, 900 350, 1200 320, 1440 350" class="wave wave4"/>
            <path d="M0 380 C 300 360, 600 420, 900 380, 1200 350, 1440 380" class="wave wave5"/>
            <path d="M0 410 C 300 390, 600 450, 900 410, 1200 380, 1440 410" class="wave wave6"/>
        </svg>
    </div>

    <!-- CONTENT -->
    <div class="hero-content">
        <h1>עובדים טוב יותר, ביחד</h1>

        <p>
            פלטפורמה אחת שמחברת בין אנשים, קהילות ומרחבי עבודה –  
            לשיתופי פעולה, אירועים וחיבורים אמיתיים.
        </p>

        <div class="hero-tags">
            <span>מציאת מרחבים</span>
            <span>קהילות פעילות</span>
            <span>אירועים משותפים</span>
        </div>

        <button class="hero-cta" onclick="window.location.href='signup.html'">
            הצטרפות ל-CoNet
        </button>
    </div>

</main>

</body>
</html>
