<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoNet – פלטפורמה לקהילות ומרחבי עבודה</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Landing CSS -->
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<!-- =========================
     TOP NAVBAR – SAME AS SITE
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="communities.html">הקהילות של CoNet</a>
            <a href="search.html">המרחבים של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
            <a href="profile.html">הפרופיל שלי</a>
        </nav>

        <div class="conet-user">
            <button onclick="location.href='login.html'">
                התחברות
            </button>
        </div>

    </div>
</header>

<!-- =========================
     HERO
========================= -->
<main class="landing-hero">

    <div class="hero-inner">

        <!-- TEXT -->
        <div class="hero-text">
            <span class="hero-eyebrow">העתיד של עבודה קהילתית</span>

            <h1>
                מצאו מרחבים.<br>
                בנו קהילות.<br>
                צרו חיבורים.
            </h1>

            <p>
                CoNet היא פלטפורמה חכמה שמחברת בין אנשים,
                קהילות ומרחבי עבודה — לניהול אירועים,
                עבודה משותפת וחיזוק קהילתיות.
            </p>

            <div class="hero-actions">
                <button class="primary-cta" onclick="location.href='signup.html'">
                    התחילו עכשיו
                </button>

                <button class="secondary-cta" onclick="location.href='login.html'">
                    כבר יש לי חשבון
                </button>
            </div>
        </div>

        <!-- VISUAL -->
        <div class="hero-visual">
            <div class="visual-card">
                <span>📍 מרחבים זמינים</span>
                <span>👥 קהילות פעילות</span>
                <span>📅 אירועים מנוהלים</span>
            </div>
        </div>

    </div>

</main>

</body>
</html>
