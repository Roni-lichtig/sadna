<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoNet – Work Together</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Landing CSS -->
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<!-- =========================
     TOP NAVBAR (GUEST)
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="search.html">המרחבים של CoNet</a>
            <a href="communities.html">הקהילות של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <div class="conet-user">
            <button
                class="conet-logout-btn"
                onclick="window.location.href='login.html'">
                התחברות
            </button>
        </div>

    </div>
</header>

<!-- =========================
     HERO
========================= -->
<main class="landing-hero">

    <!-- WAVES -->
    <div class="waves">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,160 C240,220 480,100 720,120 960,140 1200,200 1440,160 L1440,0 L0,0 Z"></path>
        </svg>
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,180 C300,140 600,260 900,200 1200,140 1440,180 1440,180 L1440,0 L0,0 Z"></path>
        </svg>
    </div>

    <!-- CONTENT -->
    <div class="hero-inner">
        <h1>עובדים טוב יותר, ביחד</h1>

        <p class="hero-subtitle">
            פלטפורמה אחת שמחברת בין אנשים, קהילות ומרחבי עבודה –
            למציאת שיתופי פעולה, אירועים וחללים שמתאימים בדיוק לך.
        </p>

        <div class="hero-features">
            <span>🔹 מציאת מרחבי עבודה</span>
            <span>🔹 קהילות ונטוורקינג</span>
            <span>🔹 אירועים ומפגשים</span>
        </div>

        <button
            class="primary-cta"
            onclick="window.location.href='signup.html'">
            הצטרפות ל-CoNet
        </button>
    </div>

</main>

</body>
</html>
