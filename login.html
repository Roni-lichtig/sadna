<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoNet – התחברות</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap (ONLY FOR NAVBAR) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Global Design (banner + auth layout) -->
  <link rel="stylesheet" href="auth.css">
</head>

<body>

<!-- =========================
     TOP NAVBAR – LOGIN PAGE
========================= -->
<nav class="navbar navbar-expand-md fixed-top bg-white shadow-sm">
  <div class="container-fluid px-4">

    <!-- LOGO – RIGHT -->
    <a class="navbar-brand ms-auto" href="index.html">
      <img src="conetnew_logo.jpg" alt="CoNet" style="height: 60px;">
    </a>

    <!-- HAMBURGER – MOBILE -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#loginNavbar"
      aria-controls="loginNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAV LINKS + SIGNUP -->
    <div class="collapse navbar-collapse" id="loginNavbar">

      <!-- CENTER LINKS -->
      <ul class="navbar-nav mx-auto mb-2 mb-md-0 gap-3 text-center">
        <li class="nav-item">
          <a class="nav-link conet-link" href="communities.html">
            הקהילות של CoNet
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link conet-link" href="search.html">
            המרחבים של CoNet
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link conet-link" href="events.html">
            האירועים של CoNet
          </a>
        </li>
      </ul>

      <!-- SIGNUP CTA – LEFT -->
      <div class="d-flex justify-content-center justify-content-md-start">
        <button
          class="conet-logout-btn"
          onclick="window.location.href='signup.html'">
          הרשמה
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- =========================
     PAGE CONTENT
========================= -->
<div class="auth-wrapper">
  <div class="auth-container">

    <div class="auth-card">

      <h2 class="auth-heading">התחברות</h2>
      <p class="auth-subtext">ברוכה הבאה חזרה 💙</p>

      <form id="loginForm">

        <div class="mb-3">
          <label for="loginEmail">אימייל</label>
          <input
            type="email"
            class="form-control"
            id="loginEmail"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="mb-3">
          <label for="loginPassword">סיסמה</label>
          <input
            type="password"
            class="form-control"
            id="loginPassword"
            placeholder="••••••"
            required
          >
        </div>

        <button type="submit" class="auth-btn">
          התחברות
        </button>

      </form>

      <p class="auth-switch">
        אין לך חשבון?
        <a href="signup.html">הרשמה</a>
      </p>

    </div>

  </div>
</div>

<!-- Bootstrap JS (collapse only) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- LOGIN LOGIC ONLY -->
<script src="auth.js"></script>

</body>
</html>
