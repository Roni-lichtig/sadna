<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoNet – התחברות</title>

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap CSS (UTILITIES ONLY – loaded BEFORE your CSS) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Global Design (banner + auth layout) -->
  <link rel="stylesheet" href="auth.css">
</head>

<body>

<!-- =========================
     TOP NAVBAR – LOGIN PAGE
     ORIGINAL DESIGN, BOOTSTRAP FOR LAYOUT ONLY
========================= -->
<header class="conet-navbar">
  <div class="conet-navbar-inner d-flex align-items-center justify-content-between flex-wrap">

    <!-- LOGO (Right) -->
    <div class="conet-logo order-2 order-md-3">
      <a href="index.html">
        <img src="conetnew_logo.jpg" alt="CoNet">
      </a>
    </div>

    <!-- NAV (Center on desktop, wraps naturally on mobile) -->
    <nav class="conet-nav-links d-flex gap-2 flex-wrap justify-content-center order-3 order-md-2 w-100 w-md-auto mt-2 mt-md-0">
      <a href="communities.html">הקהילות של CoNet</a>
      <a href="search.html">המרחבים של CoNet</a>
      <a href="events.html">האירועים של CoNet</a>
    </nav>

    <!-- SIGNUP CTA (Left) -->
    <div class="conet-user order-1 order-md-1">
      <button
        class="conet-logout-btn"
        onclick="window.location.href='signup.html'">
        הרשמה
      </button>
    </div>

  </div>
</header>

<!-- =========================
     PAGE CONTENT
========================= -->
<div class="auth-wrapper">
  <div class="auth-container">

    <div class="auth-card">

      <h2 class="auth-heading">התחברות</h2>
      <p class="auth-subtext">ברוכה הבאה חזרה 💙</p>

      <form id="loginForm">

        <div class="mb-3">
          <label for="loginEmail">אימייל</label>
          <input
            type="email"
            class="form-control"
            id="loginEmail"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="mb-3">
          <label for="loginPassword">סיסמה</label>
          <input
            type="password"
            class="form-control"
            id="loginPassword"
            placeholder="••••••"
            required
          >
        </div>

        <button type="submit" class="auth-btn">
          התחברות
        </button>

      </form>

      <p class="auth-switch">
        אין לך חשבון?
        <a href="signup.html">הרשמה</a>
      </p>

    </div>

  </div>
</div>

<!-- LOGIN LOGIC ONLY -->
<script src="auth.js"></script>

</body>
</html>
