<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צ'אט קהילה | CoNet</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Chat CSS -->
    <link rel="stylesheet" href="chat.css">

    <!-- Socket -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- =========================
     TOP NAVBAR (GLOBAL)
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="profile.html">הפרופיל שלי</a>
            <a href="communities.html" class="active">הקהילות של CoNet</a>
            <a href="search.html">המרחבים של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <div class="conet-user">
            <span class="conet-greeting" id="userGreeting">שלום, אורח</span>
        </div>

    </div>
</header>

<!-- =========================
     CHAT PAGE
========================= -->
<div class="chat-page">

    <div class="chat-card">

        <!-- Header -->
        <div class="chat-header">
            <button
                class="back-btn"
                onclick="window.location.href='profile.html'">
                ← חזרה לפרופיל
            </button>

            <h2 id="chat-title">טוען צ'אט…</h2>
        </div>

        <!-- Messages -->
        <div id="messages-container" class="messages-container">
            <!-- נטען ע"י JS -->
        </div>

        <!-- Input -->
        <div class="input-area">
            <input
                type="text"
                id="message-input"
                placeholder="כתוב הודעה…"
                autocomplete="off"
            >
            <button id="send-btn">שלח</button>
        </div>

    </div>
</div>

<script src="chat.js"></script>
</body>
</html>
