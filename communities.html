<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הקהילות של CoNet</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Page specific CSS -->
    <link rel="stylesheet" href="communities.css">
</head>
<body>

<!-- =========================
     TOP NAVBAR (GLOBAL)
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <!-- LOGO -->
        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <!-- NAV -->
        <nav class="conet-nav-links">
            <a href="profile.html">הפרופיל שלי</a>
            <a href="communities.html" class="active">הקהילות של CoNet</a>
            <a href="search.html">המרחבים של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <!-- USER AREA -->
        <div class="conet-user">
            <span class="conet-greeting" id="userGreeting">שלום, אורח</span>

            <button
                id="loginBtn"
                class="conet-logout-btn"
                onclick="window.location.href='login.html'">
                התחברות
            </button>

            <button
                id="logoutBtn"
                class="conet-logout-btn"
                onclick="logoutUser()">
                התנתק
            </button>
        </div>

    </div>
</header>

<!-- =========================
     PAGE CONTENT
========================= -->
<div class="main-container">

    <!-- סרגל חיפוש -->
    <div class="filters-bar">
        <div class="search-box">
            <input
                type="text"
                id="search-input"
                placeholder="חפש קהילה לפי שם או נושא..."
            >
        </div>

        <button onclick="filterCommunities()" class="filter-btn">
            חפש
        </button>

        <button onclick="resetFilters()" class="reset-btn">
            הצג הכל
        </button>
    </div>

    <!-- אזור טעינה -->
    <div id="loading" class="loading">
        טוען קהילות...
    </div>

    <!-- רשת כרטיסים -->
    <div id="communities-grid" class="communities-grid">
        <!-- נטען ע״י JS -->
    </div>

    <!-- אין תוצאות -->
    <div id="no-results" class="no-results" style="display: none;">
        לא נמצאו קהילות תואמות לחיפוש שלך.
    </div>

</div>

<!-- JS -->
<script src="communities.js"></script>

</body>
</html>
