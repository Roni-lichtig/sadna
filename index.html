<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoNet – Work Together</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="auth.css">

    <!-- Landing CSS -->
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="search.html">המרחבים של CoNet</a>
            <a href="communities.html">הקהילות של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <div class="conet-user">
            <button class="conet-logout-btn" onclick="window.location.href='login.html'">
                התחברות
            </button>
        </div>

    </div>
</header>

<main class="landing-hero">

    <!-- WAVES BACKGROUND -->
    <div class="wave-bg">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
            <path d="M0 200 C 300 180, 600 260, 900 220, 1200 180, 1440 210"
                  class="wave wave1"/>
            <path d="M0 320 C 300 300, 600 380, 900 340, 1200 300, 1440 330"
                  class="wave wave2"/>
            <path d="M0 460 C 300 440, 600 520, 900 480, 1200 440, 1440 470"
                  class="wave wave3"/>
        </svg>
    </div>

    <div class="hero-inner">
        <h1>עובדים טוב יותר, ביחד</h1>

        <p class="hero-subtitle">
            פלטפורמה אחת שמחברת בין אנשים, קהילות ומרחבי עבודה –
            לשיתופי פעולה, אירועים וחיבורים אמיתיים.
        </p>

        <div class="hero-features">
            <span>מציאת מרחבים</span>
            <span>קהילות פעילות</span>
            <span>אירועים משותפים</span>
        </div>

        <button class="primary-cta" onclick="window.location.href='signup.html'">
            הצטרפות ל-CoNet
        </button>
    </div>

</main>

</body>
</html>
