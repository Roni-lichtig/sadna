<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoNet – Work Together</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global CSS (banner וכו') -->
    <link rel="stylesheet" href="auth.css">

    <!-- Landing page CSS -->
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<!-- =========================
     TOP NAVBAR (GUEST)
========================= -->
<header class="conet-navbar">
    <div class="conet-navbar-inner">

        <div class="conet-logo">
            <img src="conetnew_logo.jpg" alt="CoNet">
        </div>

        <nav class="conet-nav-links">
            <a href="search.html">המרחבים של CoNet</a>
            <a href="communities.html">הקהילות של CoNet</a>
            <a href="events.html">האירועים של CoNet</a>
        </nav>

        <div class="conet-user">
            <button
                class="conet-logout-btn"
                onclick="window.location.href='login.html'">
                התחברות
            </button>
        </div>

    </div>
</header>

<!-- =========================
     HERO SECTION
========================= -->
<main class="landing-hero with-waves">

    <!-- רקע גלים -->
    <div class="waves-bg">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- תוכן -->
    <div class="hero-inner">
        <h1>מוצאים. נפגשים. עובדים ביחד.</h1>
        <p>
            CoNet מחברת בין אנשים, קהילות ומרחבי עבודה –  
            כדי שתוכלו לעבוד, ללמוד ולהיפגש בדרך שמתאימה לכם.
        </p>

        <div class="hero-actions">
            <button onclick="window.location.href='signup.html'" class="primary-cta">
                הצטרפות ל-CoNet
            </button>
            <button onclick="window.location.href='search.html'" class="secondary-cta">
                חיפוש מרחבים
            </button>
        </div>
    </div>

</main>

</body>
</html>
